[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vallens"
version = "0.1.0"
description = "Valorant VOD & Analytics Suite backend"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "ValLens Team" }
]
dependencies = [
    "requests>=2.31.0",
    "obs-websocket-py>=1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vallens*"]
